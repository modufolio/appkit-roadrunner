version: '3'

rpc:
    listen: tcp://127.0.0.1:6001

server:
    command: "php worker.php"
    relay: pipes
    env:
        XDEBUG_MODE: "off"

http:
    address: 0.0.0.0:8080
    middleware: ["static", "gzip"]
    static:
        dir: "public"
        forbid: [".php", ".htaccess"]
    pool:
        num_workers: 8
        max_jobs: 0
        supervisor:
            max_worker_memory: 128

logs:
    mode: production
    level: info
    channels:
        http:
            level: info
        server:
            level: info
